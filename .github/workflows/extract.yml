name: Nightly extract + load + dbt build

on:
  # Started nightly at 14:17 UTC by a Cloudflare Worker (see scheduler/), not by
  # GitHub's `schedule:` trigger, which never fired for this repo.
  workflow_dispatch: {}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANDING: r2://datastack-raw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}          # LOADER_SVC service user
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # dbt runs as its own service user (TRANSFORMER role) — see dbt/profiles.yml.
      DBT_TARGET: prod
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}  # TRANSFORMER_SVC
      DBT_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      # Re-pull the last 5 days every night. Writes are idempotent (same day ->
      # same file), so this picks up late Apple reports and heals a missed night.
      - name: Date window
        run: |
          echo "START=$(date -u -d '5 days ago' +%F)" >> "$GITHUB_ENV"
          echo "END=$(date -u -d '1 day ago' +%F)" >> "$GITHUB_ENV"

      - name: App Store sales
        run: uv run python -m extract.asc_sales "$START" "$END"

      # Apple keeps only ~35 days of these, so a missed week is recoverable but a
      # missed month is not. Defaults to the last 5 processing days.
      - name: App Store analytics (impressions, page views, sessions)
        if: always()
        run: uv run python -m extract.asc_analytics

      # Current ratings only (Apple has no history), so a missed night is a lost day.
      - name: App Store ratings (every storefront)
        if: always()
        run: uv run python -m extract.app_store_ratings

      - name: Cloudflare Web Analytics
        if: always()  # run even if the Apple step failed
        run: uv run python -m extract.cf_web_analytics "$START" "$END"

      # COPY INTO skips files it already loaded, so this only picks up new/changed ones.
      - name: Load into Snowflake (RAW)
        if: always() && env.SNOWFLAKE_PRIVATE_KEY != ''
        run: uv run python -m warehouse.sf -f warehouse/sql/02_raw_load.sql

      # ---- Transform (dbt, prod target -> ANALYTICS.STAGING / MARTS) ----
      # Runs even if an extract failed: rebuilding on slightly stale RAW is harmless,
      # and the freshness check below is what flags the gap.
      - name: dbt deps
        id: dbt_deps
        if: always() && env.DBT_SNOWFLAKE_PRIVATE_KEY != ''
        run: bin/dbt deps

      # Warn-only: a stale source shouldn't block rebuilding the marts.
      - name: dbt source freshness
        if: always() && steps.dbt_deps.outcome == 'success'
        continue-on-error: true
        run: bin/dbt source freshness

      # build = run + test in DAG order; a failing test stops its downstream models.
      - name: dbt build
        if: always() && steps.dbt_deps.outcome == 'success'
        run: bin/dbt build
