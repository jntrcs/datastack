[project]
name = "datastack"
version = "0.1.0"
description = "Personal modern data stack: extractors -> R2 -> Snowflake/Databricks -> dbt"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.127",
    "cryptography>=50.0.2",
    "dbt-core>=1.12.6",
    "dbt-snowflake>=1.12.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "snowflake-connector-python>=5.2.0",
]
