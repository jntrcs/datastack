version: 2

sources:
  - name: app_store
    database: RAW
    schema: APP_STORE
    description: App Store Connect reports for Chronic Health, loaded untouched from R2.
    # `dbt source freshness` fails if the nightly load stops arriving.
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: sales_daily
        description: >
          Apple's daily SALES/SUMMARY report, one row per (product type, country,
          device, version, ...) per day, ALL columns as text. A file can be loaded
          more than once if the extractor re-pulled it with different bytes.
        columns:
          - name: begin_date
            description: Report day, MM/DD/YYYY (Pacific time, as Apple reports it).
          - name: product_type_identifier
            description: Apple's code for the kind of transaction (download, redownload, update...).
          - name: units
            description: Count of transactions in the row (text; may be negative for refunds).
          - name: _source_file
            description: R2 path of the file this row came from.
          - name: _loaded_at
            description: When COPY INTO loaded the row.
      - name: sales_daily_files
        description: >
          Inventory of every object under raw/app_store/sales_daily/ in R2 (from a stage
          LIST at load time). Includes the empty _NO_REPORT markers the extractor writes
          for settled days where Apple returned 404, which COPY INTO can't load as rows.
          Append-only: one row per new (file_path, md5).
        config:
          loaded_at_field: _listed_at
        columns:
          - name: file_path
            description: Full stage path, e.g. s3compat://.../report_date=2026-07-22/_NO_REPORT.
          - name: md5
            description: Object checksum; a re-pulled file with new bytes gets a new row.
          - name: _listed_at
            description: When the load job first saw this (path, md5).

      # ---- Analytics Reports (from the ONGOING analytics report request) ----
      # One file per PROCESSING date. Apple restates each event date in later files
      # (observed: date D appears in the D+1 and D+2 files with identical totals), so
      # rows must NOT be summed across files: staging keeps the latest file per date.
      - name: analytics_discovery_engagement
        description: >
          "App Store Discovery and Engagement Standard": impressions, page views and
          taps on the App Store, by event, page type, source, engagement, device,
          OS version and territory. All columns text.
        columns:
          - name: date
            description: Event date, YYYY-MM-DD.
          - name: event
            description: Impression, Page view, or Tap.
          - name: counts
            description: Number of events in the row.
          - name: unique_counts
            description: Unique devices in the row. NOT additive across rows.
          - name: _source_file
            description: R2 path; contains processing_date=YYYY-MM-DD.
      - name: analytics_downloads
        description: >
          "App Downloads Standard": downloads by type (first-time, redownload, updates,
          restore), app version, device, OS, source, page type and territory.
      - name: analytics_sessions
        description: >
          "App Sessions Standard": in-app sessions, total duration (seconds) and unique
          devices, by app version, device, OS, source, page type, download date, territory.
