version: 2

models:
  - name: fct_app_downloads_daily
    description: App Store transactions (units) per day, country, device and event type.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_date, app_id, country_code, device, event_type]
    columns:
      - name: event_type
        description: first_download, redownload, update, or unknown (code not in the seed).
        data_tests:
          - accepted_values:
              arguments:
                values: [first_download, redownload, update, unknown]

  - name: fct_site_traffic_daily
    description: Non-bot website traffic per day, page, referrer, country and device.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [visit_date, request_host, request_path, referer_host, country_code, device_type]
    columns:
      - name: is_sampled
        description: True when Cloudflare sampled the underlying data (counts are estimates).

  - name: daily_kpis
    description: >
      One row per day since launch (2026-04-02): App Store downloads next to website
      traffic. Site columns are NULL before Cloudflare tracking started (2026-10-21).
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: first_time_downloads
        description: New installs (Apple product types 1, 1F, 1T, F1). Matches the site counter.
        data_tests: [not_null]
      - name: chronic_health_page_views
        description: Page views of /projects/chronic-health on jacksoncurtis.me.
