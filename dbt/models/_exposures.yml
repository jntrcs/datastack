version: 2

exposures:
  - name: databricks_download_forecast
    label: Download forecast (Databricks)
    type: ml
    maturity: medium
    description: >
      Nightly Prophet forecast of first-time downloads (lakehouse/forecast_downloads.py),
      reading daily_kpis in place through Databricks Lakehouse Federation as DATABRICKS_SVC
      (REPORTER role). Feeds the Databricks AI/BI dashboard "Chronic Health Download Forecast".
      Renaming or dropping first_time_downloads or date breaks it.
    depends_on:
      - ref('daily_kpis')
    owner:
      name: Jackson Curtis

  - name: streamlit_growth_dashboard
    label: Chronic Health growth (Streamlit in Snowflake)
    type: dashboard
    maturity: medium
    url: https://app.snowflake.com/#/streamlit-apps/ANALYTICS.DASHBOARDS.CHRONIC_HEALTH_GROWTH
    description: >
      Internal dashboard (dashboards/streamlit/), running inside Snowflake as an app owned
      by REPORTER. Headline downloads/ratings/reviews tiles and weekly charts.
    depends_on:
      - ref('current_kpis')
      - ref('weekly_kpis')
    owner:
      name: Jackson Curtis

  - name: site_datastack_page
    label: jacksoncurtis.me/projects/datastack (reverse ETL)
    type: application
    maturity: medium
    url: https://jacksoncurtis.me/projects/datastack
    description: >
      Public page. serve/site_export.py (as REVERSE_ETL_SVC) exports these marts nightly
      to r2://datastack-raw/serve/site/dashboard.json; the site Worker serves it at
      /api/datastack. Renaming a column used in WEEKLY_COLUMNS breaks the page.
    depends_on:
      - ref('current_kpis')
      - ref('weekly_kpis')
    owner:
      name: Jackson Curtis
